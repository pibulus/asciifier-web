name: Deploy
on:
  push:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build step
        run: "deno task build"

      # Classic Deno Deploy (deployctl + OIDC) died 2026-07-20. The new
      # platform deploys via the `deno deploy` CLI; org/app come from the
      # "deploy" block in deno.json, auth from DENO_DEPLOY_TOKEN (repo
      # secret, console.deno.com token).
      - name: Upload to Deno Deploy
        run: deno deploy --prod --non-interactive
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
